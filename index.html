<style type="text/tailwindcss">
  @theme {
    --color-ink: #1A283C;
    --color-deep: #243982;
    --color-sky: #C2C5C8;
    --color-amber: #f7c940;
    --color-bone: #f6f4ef;

<style>
  html, body { background: #f6f4ef; color: #1A283C; font-family: 'Montserrat', sans-serif; }
  .font-head { font-family: 'Teko', sans-serif; letter-spacing: 0.01em; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }

  /* placeholder "photo" surface — subtle diagonal stripes */
  .ph-stripes {
    background-color: #1A283C;
    background-image:
      repeating-linear-gradient(135deg, rgba(247,201,64,0.08) 0 2px, transparent 2px 14px),
      linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.05) 60%, rgba(0,0,0,0.55));
  }
  .ph-stripes-light {
    background-color: #ECEEF0;
    background-image:
      repeating-linear-gradient(135deg, rgba(26,40,60,0.08) 0 2px, rgba(247,201,64,0.06) 2px 4px, transparent 4px 14px);
  }

  /* hazard tape accent */
  .hazard {
    background-image: repeating-linear-gradient(135deg,
      #f7c940 0 12px,
      #1A283C 12px 24px,
      #C2C5C8 24px 36px);
  }

  /* subtle blueprint grid */
  .blueprint {
    background-image:
      linear-gradient(rgba(26,40,60,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(26,40,60,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(247,201,64,0.10) 0 1px, transparent 1px);
    background-size: 48px 48px, 48px 48px, 96px 96px;
  }

  /* card lift */
  .lift { transition: transform 280ms cubic-bezier(.2,.7,.2,1), box-shadow 280ms, border-color 280ms; }
  .lift:hover { transform: translateY(-4px); box-shadow: 0 24px 48px -24px rgba(26,40,60,0.35), 0 4px 0 0 #1A283C; border-color: #1A283C; }

  .underline-amber { background-image: linear-gradient(transparent 70%, rgba(247,201,64,0.45) 70%); background-repeat: no-repeat; padding: 0 .08em; }

  /* nav scroll */
  html { scroll-behavior: smooth; }
  body { scroll-padding-top: 88px; }

  /* marquee */
  /* -12.5% = -100%/MARQUEE_COPIES (8 copies, set in sections.jsx) — moves
     the strip by exactly one copy's width, so the repeat is seamless. */
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-12.5%); } }
  .marquee-track { width: max-content; animation: marquee 38s linear infinite; }

  /* slow ken-burns on hero */
  @keyframes drift { 0% { transform: scale(1.05) translate3d(0,0,0); } 100% { transform: scale(1.12) translate3d(-2%, -1%, 0); } }
  .drift { animation: drift 24s ease-in-out infinite alternate; }

  /* counter-up base */
  .reveal { opacity: 1; transform: none; transition: opacity .9s ease, transform .9s cubic-bezier(.2,.7,.2,1); }
  .reveal.pre { opacity: 0; transform: translateY(14px); }

  /* tweak panel positioning override */
  .tweaks-floating { z-index: 60; }
</style>
